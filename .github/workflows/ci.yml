# Revisión automática en cada push a main y en cada pull request: lint, tipos
# y pruebas. No compila ni despliega: `next build` necesita las credenciales de
# producción (R2, Supabase) y el despliegue sigue siendo manual (ver CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Las pruebas usan `--experimental-strip-types` y `module.registerHooks`.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
